{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition</title>
<!--<link rel="stylesheet" href="{%static 'style.css' %}"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .col,.col-8,.col-4{
            background-color: yellow;
            margin: 2px;
        }
        body{
            /*background-color: #ffffff;*/
            display:flex;
            flex-direction: column;
            flex: 1;
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url("{%static 'back.png' %}");
            background-color: rgb(205, 205, 205);
            height: 110vh;
            width: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size : cover;
        }

    </style>
</head>

<body>
    <div class="container-md text-center" style="margin-top: 150px;"> 
        <div class="row justify-content-center">
          <div class="col-md-8 text-center p-4 text-white ml-5" style="border-radius: 20px; background-color: rgba(0, 0, 0, 0.4); ">

            <h1 style="font-size: 3rem; color: white; transition: color 0.3s, transform 0.3s; text-shadow: 0 0 10px #800080, 0 0 15px #800080; cursor: pointer;">
                <a href="/" style="text-decoration: none; color: inherit;">Face recognition app</a>
            </h1>

              <p>Fotoğraflardaki yüzleri video üzerinde tanıyan bir uygulama.</p>

                <form id="uploadForm" action="/upload/" method="post" enctype="multipart/form-data">
                    {% csrf_token %}  <!-- Django için CSRF token -->
                    <div class="btn-group mt-4" role="group" aria-label="Basic example">
                        <input type="file" id="photoInput" name="photos" accept="image/*" style="display: none;" multiple>
                        <input type="file" id="videoInput" name="video" accept="video/*" style="display: none;">
                
                        <button type="button" class="btn btn-primary" onclick="document.getElementById('photoInput').click();">Fotoğrafları Seç</button>
                        <button type="button" class="btn btn-success" onclick="document.getElementById('videoInput').click();">Video Seç</button>
                        <button type="submit" class="btn btn-danger">Çalıştır</button>
                    </div>
                </form>

                <div class="spinner-border text-secondary mt-4" id="loading" role="status" style="display: none;">
                    <span class="visually-hidden"></span>
                </div>


                <form class="mt-4" style="display:none;" action="{% url 'run_script' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">Scripti Çalıştır</button>
                </form>
            
            </div>

          </div>

          

        </div>
      </div>

      <script>
        document.getElementById('uploadForm').addEventListener('submit', function() {
            document.getElementById('loading').style.display = 'inline-block'; // Spinner'ı göster
        });
    </script>

</body>

    <footer class="text-white text-center py-3" style="background-color: rgba(0, 0, 0, 0.4); margin-top: 40vh;">
        <div class="container">
            <p class="mb-0" style="font-size: 1rem;">
                © 2024 Missoft
                <span class="border-start mx-2"></span><b>Geliştirici:</b> Abdulhalik Akdeniz
                <span class="border-start mx-2"></span> Tüm Hakları Saklıdır.
            </p>

        </div>
    </footer>

</html>
